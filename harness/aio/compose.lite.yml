# Lite PicoMQ: SQLite metadata + file:// object storage (no Postgres/RustFS).
# From this directory: docker compose -f compose.lite.yml up --build
#
# Protocol: set PICO_PROTOCOL=pico|ds in .env (see .env.example).

services:
  pico:
    build:
      context: ../..
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      PICO_PROTOCOL: ${PICO_PROTOCOL:-pico}
      PICO_NODE_ID: "1"
      PICO_LISTEN: 0.0.0.0:4437
      PICO_ADMIN_LISTEN: 0.0.0.0:9090
      PICO_HTTP_ADDRESS: http://localhost:4437
      PICO_META_URL: sqlite:/data/meta.db
      PICO_STORAGE: "-2@file:///objects"
    volumes:
      - pico-data:/data
      - pico-objects:/objects
    ports:
      - "4437:4437"
      - "9090:9090"
    restart: unless-stopped

volumes:
  pico-data:
  pico-objects:
