# Single node. MinIO on the Docker host (container → host.docker.internal:9000).
global:
  clusterName: minio
  storage: 0@s3://streams-data?region=us-east-1&endpoint=http://host.docker.internal:9000&pathStyle=true
  wal: 0@s3://streams-wal?region=us-east-1&endpoint=http://host.docker.internal:9000&pathStyle=true
  config:
    routing: LOCAL_ALWAYS
    walCacheSize: 209715200
    blockCacheSize: 104857600
  envs:
    - name: AWS_ACCESS_KEY_ID
      value: minioadmin
    - name: AWS_SECRET_ACCESS_KEY
      value: minioadmin
    - name: AWS_REGION
      value: us-east-1
nodes:
  - host: 127.0.0.1
    nodeId: 1
    httpPort: 4437
    raftPort: 8091
    dataDir: /tmp/streamstack/minio/n1
