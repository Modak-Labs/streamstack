# Three nodes on one host (ports 4437–4439 / 8091–8093 / admin 9091–9093). MinIO at 127.0.0.1:9000 (host network).
global:
  clusterName: cluster
  storage: 0@s3://streams-data?region=us-east-1&endpoint=http://127.0.0.1:9000&pathStyle=true
  wal: 0@s3://streams-wal?region=us-east-1&endpoint=http://127.0.0.1:9000&pathStyle=true
  config:
    routing: REDIRECT
    walCacheSize: 209715200
    blockCacheSize: 104857600
  envs:
    - name: AWS_ACCESS_KEY_ID
      value: minioadmin
    - name: AWS_SECRET_ACCESS_KEY
      value: minioadmin
    - name: AWS_REGION
      value: us-east-1
nodes:
  - host: 127.0.0.1
    nodeId: 1
    httpPort: 4437
    adminPort: 9091
    raftPort: 8091
    dataDir: /tmp/streamstack/cluster/n1
  - host: 127.0.0.1
    nodeId: 2
    httpPort: 4438
    adminPort: 9092
    raftPort: 8092
    dataDir: /tmp/streamstack/cluster/n2
  - host: 127.0.0.1
    nodeId: 3
    httpPort: 4439
    adminPort: 9093
    raftPort: 8093
    dataDir: /tmp/streamstack/cluster/n3
