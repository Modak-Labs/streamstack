name: Publish

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Maven revision (empty uses 0.1.0-SNAPSHOT)
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  packages:
    name: native-client
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: github

      - name: Revision
        id: revision
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.revision }}" ]]; then
            echo "value=${{ inputs.revision }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=(-B -ntp -DskipTests -pl frontend/native/client -am deploy)
          if [[ -n "${{ steps.revision.outputs.value }}" ]]; then
            args+=(-Drevision="${{ steps.revision.outputs.value }}")
          fi
          mvn "${args[@]}"
