services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/streams-data || true &&
      mc mb -p local/streams-wal || true &&
      echo buckets-ready
      "

  node1:
    profiles: ["single", "cluster"]
    image: eclipse-temurin:21-jre
    depends_on:
      minio-init:
        condition: service_completed_successfully
    working_dir: /opt/streamstack
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
    volumes:
      - ./:/opt/streamstack:ro
      - node1-data:/var/streamstack/n1
    network_mode: host
    command:
      - /bin/sh
      - -c
      - |
        echo "MinIO is up. Start DurableStreamsServer against it (see docs/deploy.md)."
        sleep infinity

volumes:
  minio-data:
  node1-data:
