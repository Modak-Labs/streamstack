# Three nodes on one host (ports 4437–4439 / 8091–8093 / admin 9091–9093). Real S3. DATA_BUCKET / WAL_BUCKET override the URIs.
global:
  clusterName: aws
  storage: 0@s3://streamstack-data?region=us-east-1
  wal: 0@s3://streamstack-wal?region=us-east-1
  config:
    routing: REDIRECT
    walCacheSize: 209715200
    blockCacheSize: 104857600
nodes:
  - host: 127.0.0.1
    nodeId: 1
    httpPort: 4437
    adminPort: 9091
    raftPort: 8091
    dataDir: /tmp/streamstack/aws/n1
  - host: 127.0.0.1
    nodeId: 2
    httpPort: 4438
    adminPort: 9092
    raftPort: 8092
    dataDir: /tmp/streamstack/aws/n2
  - host: 127.0.0.1
    nodeId: 3
    httpPort: 4439
    adminPort: 9093
    raftPort: 8093
    dataDir: /tmp/streamstack/aws/n3
